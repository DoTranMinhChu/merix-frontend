name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Chạy test TRƯỚC build. Các test này giữ các ràng buộc nghiệp vụ: `formatProbability`
      # không bao giờ trả 0.5 thay cho `null`, `duongDanAnToan` chặn open redirect,
      # `nguonGocHopLe` chặn CSRF, và enum viết tay khớp `contracts/openapi.json`.
      #
      # `contracts/openapi.json` là bản chụp hợp đồng sinh từ backend, được commit nên bước này
      # không cần dựng backend. Kiểm lệch với backend thật: `npm run check:contract` (chạy tay).
      - run: npm test
      # `build` đã gồm `astro check`, tức là type-check đầy đủ.
      - run: npm run build
