openapi: 3.1.0

info:
  title: MERIX API
  version: 0.1.0
  description: |
    Nền tảng dự báo **xác suất** tăng / không tăng cho thị trường, ngành và cổ phiếu Việt Nam.

    ## Ràng buộc không thương lượng

    1. Đầu ra chỉ gồm `probabilityUp` và `probabilityNotUp`. **Không có khuyến nghị mua/bán.**
    2. `probabilityNotUp` là **phần bù**, gồm cả trường hợp giá đi ngang. Không đồng nhất với
       "giảm". Muốn ba trạng thái thì phải có mô hình 3 lớp được huấn luyện riêng.
    3. Không đủ dữ liệu thì `predictionStatus` là `UNAVAILABLE` kèm `abstainReason`.
       **Không bao giờ trả `0.5` thay cho "không biết"** — 0.5 là một dự báo có nội dung.
    4. Mọi phản hồi dự báo đều mang `validationStatus`. Theo bằng chứng hiện có
       (`EMPIRICAL_RESULTS_VI.md` §C9), giá trị thực tế sẽ là `NOT_VALIDATED` hoặc
       `BASELINE_ONLY` trong thời gian dài. **Đó là trạng thái đúng, không phải lỗi.**
    5. Mọi phản hồi mang trường `disclaimer`. Nằm trong dữ liệu chứ không phải trong code
       frontend, để ràng buộc "mọi trang đều có disclaimer" không phụ thuộc trí nhớ lập trình viên.

    ## Quy ước đặt tên (ADR-019)

    - Khóa JSON và query param: **camelCase**
    - Giá trị enum: **SCREAMING_SNAKE**
    - Đường dẫn URL: **kebab-case**

  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Phát triển local

tags:
  - name: forecast
    description: Dự báo xác suất (công khai)
  - name: asset
    description: Danh mục tài sản (công khai)
  - name: status
    description: Trạng thái dữ liệu (công khai)
  - name: health
    description: Health check
  - name: auth
    description: Xác thực admin
  - name: admin-data
    description: Quản trị dữ liệu
  - name: admin-model
    description: Quản trị mô hình
  - name: admin-ops
    description: Vận hành

# ─────────────────────────────────────────────────────────────────────────────
# Phần `paths` đã được BỎ KHỎI file này, có chủ ý.
#
# Đặc tả đường dẫn có thật nằm ở `/openapi.json`, SINH TỪ CODE: mỗi entity tự khai
# `#[crud(...)]` và mỗi route viết tay tự đăng ký `PathDocReg`. Xem `/docs` để bấm thử.
#
# Vì sao bỏ: file này từng mô tả `paths` song song với code, và nó đã lệch ở năm chỗ —
# đường dẫn `admin/model-versions` không tồn tại, query param `level`/`q`/`pageSize` không
# phải tên thật (`filter`/`search`/`limit`), `POST job-runs` ghi 202 + 409 trong khi code trả
# 200 + `created: false`, hình dạng danh sách ghi `{items,total}` trong khi code trả
# `{edges,pageInfo}`, và bảy endpoint không hề được khai. Hai nguồn mô tả cùng một thứ thì
# một trong hai sẽ sai, và người đọc không có cách nào biết là nguồn nào.
#
# Phần còn lại của file — các ràng buộc ở `info.description` và `components.schemas` — là
# TỪ VỰNG DÙNG CHUNG giữa backend, frontend và tài liệu. Nó có lý do tồn tại riêng: bốn enum
# dưới đây được test đối chiếu HAI CHIỀU với code (`JobType`, `ValidationStatus`,
# `AbstainReason`, `AssetLevel`), nên lệch một giá trị là test đỏ ở cả hai phía.
# ─────────────────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AssetLevel:
      type: string
      enum:
        - MARKET
        - SECTOR
        - STOCK
      description: |
        SCREAMING_SNAKE ở **cả** query param và phản hồi, theo ADR-019.

        Bản đầu của hợp đồng ghi chữ thường cho query param và chú thích rằng DB dùng chữ hoa.
        Hai quy ước trong một API là một chỗ để lệch: `?assetLevel=stock` trả `level: "STOCK"`
        buộc mọi client phải tự chuyển đổi, và quên chuyển là một lỗi im lặng. Nay một quy ước.

    ValidationStatus:
      type: string
      enum:
        - NOT_VALIDATED
        - BASELINE_ONLY
        - VALIDATED_EXPLORATORY
        - VALIDATED_PROSPECTIVE
        - DEGRADED
      description: |
        - `NOT_VALIDATED` — chưa có walk-forward hoàn tất
        - `BASELINE_ONLY` — chỉ có baseline lịch sử, không tuyên bố skill
        - `VALIDATED_EXPLORATORY` — có walk-forward nhưng CI chứa 0 hoặc dữ liệu đã tái sử dụng
        - `VALIDATED_PROSPECTIVE` — OOS tiền đăng ký, CI loại trừ 0 sau hiệu chỉnh đa phép thử
        - `DEGRADED` — phát hiện trôi calibration

        Giao diện **phải** hiện cảnh báo cạnh con số với mọi giá trị trừ `VALIDATED_PROSPECTIVE`.

    PredictionStatus:
      type: string
      enum: [LIVE, STALE, UNAVAILABLE, ABSTAINED]

    AbstainReason:
      type: string
      enum:
        - INSUFFICIENT_HISTORY
        - LOW_COVERAGE
        - INSUFFICIENT_TRAINING_DATA
        - PENDING_CORPORATE_ACTION
        - CALIBRATION_DEGRADED
        - TARGET_SESSION_UNKNOWN

    ModelStatus:
      type: string
      enum: [DRAFT, SHADOW, ACTIVE, RETIRED]

    JobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]

    JobType:
      type: string
      enum:
        - INGEST_UNIVERSE
        - INGEST_PRICE
        - INGEST_CORPORATE_ACTIONS
        - INGEST_INDUSTRY
        - REBUILD_CALENDAR
        - BUILD_SECTOR_INDEX
        - COMPUTE_FEATURE
        - COMPUTE_FORECAST
        - EVALUATE_FORECAST
        - RUN_VALIDATION

    Asset:
      type: object
      required: [assetId, level, symbol, name, status]
      properties:
        assetId: { type: integer, format: int64 }
        level: { $ref: "#/components/schemas/AssetLevel" }
        symbol: { type: string, example: FPT }
        name: { type: string, example: CTCP FPT }
        exchange: { type: [string, "null"], example: HSX }
        currency: { type: string, example: VND }
        icbCode: { type: [string, "null"], example: "9500" }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DELISTED] }
        listedFrom: { type: [string, "null"], format: date }
        listedTo:
          type: [string, "null"]
          format: date
          description: Khác null nghĩa là đã hủy niêm yết.

    AssetPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    HorizonForecast:
      type: object
      required: [horizonSessions, predictionStatus]
      properties:
        asOf: { type: string, format: date-time, description: Decision time for this horizon. }
        dataThrough: { type: string, format: date, description: Latest input session for this horizon. }
        modelVersion: { type: string }
        validationStatus: { $ref: "#/components/schemas/ValidationStatus" }
        horizonSessions:
          type: integer
          enum: [1, 5, 21, 63, 252]
          description: |
            Tính bằng **phiên giao dịch**, không phải ngày lịch. `5` không phải "một tuần" trong
            tuần có nghỉ lễ.
        predictionStatus: { $ref: "#/components/schemas/PredictionStatus" }
        probabilityUp:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Null khi predictionStatus không phải LIVE/STALE.
        probabilityNotUp:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: |
            **Phần bù của probabilityUp**, gồm cả giá đi ngang. KHÔNG phải xác suất giảm.
            `probabilityUp + probabilityNotUp = 1`.
        targetDate:
          type: [string, "null"]
          format: date
          description: Phiên đích thực tế sau `horizonSessions` phiên.
        abstainReason:
          oneOf:
            - { $ref: "#/components/schemas/AbstainReason" }
            - { type: "null" }

    ForecastResponse:
      type: object
      required:
        [asset, asOf, dataThrough, modelVersion, validationStatus, disclaimer, horizons]
      properties:
        asset: { $ref: "#/components/schemas/Asset" }
        asOf:
          type: string
          format: date-time
          description: Thời điểm ra quyết định. Mọi feature chỉ dùng dữ liệu available_at <= mốc này.
        dataThrough:
          type: string
          format: date
          description: Phiên giao dịch mới nhất mà dữ liệu đã tới. Khác asOf khi nguồn trễ.
        modelVersion: { type: string, example: logistic-fs-v1-h21 }
        validationStatus: { $ref: "#/components/schemas/ValidationStatus" }
        disclaimer:
          type: string
          example: Thông tin nghiên cứu, không phải tư vấn đầu tư.
        horizons:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/HorizonForecast" }
      example:
        asset:
          assetId: 42
          level: stock
          symbol: FPT
          name: CTCP FPT
          exchange: HSX
          currency: VND
          icbCode: "9500"
          status: ACTIVE
          listedFrom: "2006-12-13"
          listedTo: null
        asOf: "2026-10-16T15:30:00+07:00"
        dataThrough: "2026-10-16"
        modelVersion: baseline-history-h21
        validationStatus: BASELINE_ONLY
        disclaimer: Thông tin nghiên cứu, không phải tư vấn đầu tư.
        horizons:
          - horizonSessions: 1
            predictionStatus: LIVE
            probabilityUp: 0.5231
            probabilityNotUp: 0.4769
            targetDate: "2026-10-17"
            abstainReason: null
          - horizonSessions: 252
            predictionStatus: UNAVAILABLE
            probabilityUp: null
            probabilityNotUp: null
            targetDate: null
            abstainReason: INSUFFICIENT_HISTORY

    DataStatus:
      type: object
      required: [latestTradingDate, isStale, disclaimer, sources]
      properties:
        latestTradingDate: { type: [string, "null"], format: date }
        latestIngestAt: { type: [string, "null"], format: date-time }
        latestComputeAt: { type: [string, "null"], format: date-time }
        sessionsBehind:
          type: integer
          description: Số phiên dữ liệu đang chậm so với hôm nay.
        isStale: { type: boolean }
        disclaimer: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [code, enabled]
            properties:
              code: { type: string }
              enabled: { type: boolean }
              lastSuccessAt: { type: [string, "null"], format: date-time }
        coverage:
          type: object
          properties:
            assetsTotal: { type: integer }
            assetsWithForecast: { type: integer }
            ratio: { type: number, minimum: 0, maximum: 1 }

    JobRun:
      type: object
      required: [jobRunId, jobType, status, requestedAt]
      properties:
        jobRunId: { type: integer, format: int64 }
        jobType: { $ref: "#/components/schemas/JobType" }
        status: { $ref: "#/components/schemas/JobStatus" }
        params: { type: object, additionalProperties: true }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        attempts: { type: integer }
        stats: { type: [object, "null"], additionalProperties: true }
        lastError: { type: [string, "null"] }

    ModelVersion:
      type: object
      required:
        [modelVersionId, code, family, assetLevel, horizonSessions, status, validationStatus]
      properties:
        modelVersionId: { type: integer, format: int64 }
        code: { type: string }
        family: { type: string, example: logistic }
        assetLevel: { $ref: "#/components/schemas/AssetLevel" }
        horizonSessions: { type: integer }
        featureSetVersion:
          type: string
          example: fs-a1b2c3d4e5f6
          description: Hash tự sinh từ tập FeatureSpec đang đăng ký, không phải chuỗi gõ tay.
        hyperparams: { type: object, additionalProperties: true }
        codeSha256: { type: string }
        trainedThrough: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/ModelStatus" }
        validationStatus: { $ref: "#/components/schemas/ValidationStatus" }
        activatedAt: { type: [string, "null"], format: date-time }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Số giây access token còn hiệu lực. }

    Liveness:
      type: object
      required: [status, service, version, uptimeSeconds]
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: main-service }
        version: { type: string, example: 0.1.0 }
        uptimeSeconds: { type: integer }

    Readiness:
      type: object
      required: [status, service, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        service: { type: string }
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: object
              required: [reachable, latencyMs]
              properties:
                reachable: { type: boolean }
                latencyMs: { type: integer }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Mã lỗi ổn định. Frontend branch theo mã này, **không** theo chuỗi `message`.

            Kernel sinh: `BAD_REQUEST`, `UNAUTHORIZED`, `FORBIDDEN`, `NOT_FOUND`, `CONFLICT`,
            `INTERNAL_ERROR`.

            Module được phép thêm mã riêng cho cùng một mã HTTP, nên danh sách này **không
            đóng** — một `enum` ở đây sẽ khẳng định một danh sách đầy đủ mà nó không thể biết.
            Mã module hiện có:

            - `FORECAST_NOT_READY` (404) — mã **có** trong hệ thống nhưng chưa tính dự báo.
              Khác `NOT_FOUND` (404), nghĩa là không có mã đó. Hai nhánh này từng dùng chung
              một mã, và hậu quả là trang người dùng nói một mã niêm yết thật là không tồn tại.
        message:
          type: string
          description: |
            An toàn để hiển thị. Với `INTERNAL_ERROR` luôn là chuỗi chung chung — chi tiết chỉ
            nằm trong log phía server, kèm request id.

security:
  - bearerAuth: []
